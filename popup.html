<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FluentVoice</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <h1>FluentVoice</h1>

  <textarea id="text" placeholder="Type or paste a word or phrase..."></textarea>

  <select id="language">
    <option value="en-US">English (US)</option>
    <option value="pt-BR">Portuguese (Brazil)</option>
  </select>

  <label class="speed">
    Speed
    <input type="range" id="speed" min="0.7" max="1.2" step="0.1" value="1">
  </label>

  <button id="speak">🔊 Listen</button>
  <button id="translate">🌍 Translate EN → PT-BR (Premium)</button>

  <div class="limit" id="limitInfo"></div>

  <div class="pro">
    Unlimited premium voice and advanced features — <span>PRO</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
