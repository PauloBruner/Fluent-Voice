<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FluentVoice</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <h1>Fluent Voice</h1>

  <textarea id="text" placeholder="Type or paste a word or phrase..."></textarea>

  <div class="selectors">
    <div>
      <label>From</label>
      <select id="fromLang">
        <option value="en">English</option>
        <option value="pt">Portuguese (Brazil)</option>
        <option value="es">Spanish</option>
      </select>
    </div>

    <div>
      <label>To</label>
      <select id="toLang">
        <option value="pt">Portuguese (Brazil)</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
      </select>
    </div>
  </div>

  <button id="translate">🔁 Translate</button>
  <button id="listen">🔊 Listen</button>

  <script src="popup.js"></script>
</body>
</html>
